<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vynora — Messenger Prototype</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#e9eaf0;background:#191a20}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;border:0;color:inherit;background:transparent}button:hover,.item:hover{background:#393a45}header{height:49px;border-bottom:1px solid #292a32;display:flex;align-items:center;gap:18px;padding:0 18px;font-weight:650}.app{display:flex;height:100dvh}.servers{width:70px;background:#111217;padding:14px 10px;display:flex;flex-direction:column;gap:12px;align-items:center}.server{width:44px;height:44px;border-radius:16px;background:#282932;font-size:21px}.server.active{background:#5865f2;border-radius:14px}.sidebar{width:290px;min-width:230px;background:#14151a;display:flex;flex-direction:column}.sidebar .search{margin:10px;background:#24252c;padding:11px;border-radius:8px;color:#b9bac6;font-size:12px}.nav{padding:0 9px;overflow:auto;flex:1}.item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:8px;color:#b6b8c5;text-align:left;width:100%}.item.selected{background:#303139;color:white}.muted{color:#90919f;font-size:12px;margin:20px 12px 8px}.avatar{display:inline-grid;place-items:center;flex-shrink:0;width:34px;height:34px;border-radius:50%;background:#5865f2;color:white;font-weight:700}.user{padding:12px;background:#22232a;display:flex;gap:10px;align-items:center}.online{color:#36c98c;font-size:12px}.main{flex:1;min-width:0;display:flex;flex-direction:column}.content{display:flex;flex:1;min-height:0}.center{flex:1;display:flex;flex-direction:column;min-width:0}.right{width:285px;border-left:1px solid #2b2c35;padding:16px}.right h3{margin:0 0 12px}.empty{background:#23242c;border-radius:8px;padding:20px;text-align:center;color:#b6b7c4;font-size:13px}.tabs{display:flex;gap:12px}.tab{border-radius:6px;padding:7px 13px}.tab.active{background:#34353e}.tab.primary{background:#5865f2}.friends{padding:16px 22px}.filter{width:100%;background:#121319;border:1px solid #393a45;border-radius:7px;padding:11px;color:white;margin-bottom:16px}.friend{border-top:1px solid #30313a;padding:12px 0;display:flex;align-items:center;gap:12px}.friend button:last-child{margin-left:auto}.messages{flex:1;overflow:auto;padding:20px 24px;display:flex;flex-direction:column;gap:17px}.msg{display:flex;gap:12px}.msg p{margin:4px 0;white-space:pre-wrap;overflow-wrap:anywhere}.msg small{color:#999ba8}.composer{display:flex;margin:12px 18px 22px;background:#363740;border-radius:9px;padding:9px;gap:8px}.composer input{background:transparent;color:white;border:0;outline:0;flex:1;min-width:0}.composer button{background:#5865f2;padding:9px 14px;border-radius:6px}.hidden{display:none!important}@media(max-width:900px){.right{display:none}.sidebar{width:210px}}@media(max-width:600px){.servers{width:53px;padding:8px 3px}.sidebar{width:135px;min-width:135px}.sidebar .search{font-size:10px}.item{font-size:12px;padding:9px}.avatar{width:28px;height:28px}.tabs{gap:2px}.tab{padding:6px;font-size:12px}.friends{padding:10px}.user{font-size:11px}}
</style></head><body><div class="app"><aside class="servers"><button class="server active" title="Start" onclick="showFriends()">✦</button><button class="server" onclick="chooseServer('Vynora Lounge')">V</button><button class="server" onclick="chooseServer('Gaming')">🎮</button><button class="server" title="Server erstellen" onclick="addServer()">＋</button></aside><aside class="sidebar"><div class="search">Unterhaltung suchen</div><nav class="nav"><button class="item selected" id="friendsNav" onclick="showFriends()">♟ &nbsp; Freunde</button><a class="item" href="./cloud.html" style="text-decoration:none;background:#242635;color:#cdd2ff">☁ &nbsp; Vynora Cloud (Login)</a><div class="muted">DIREKTNACHRICHTEN <button style="float:right" onclick="addFriend()">＋</button></div><div id="dmList"></div><div class="muted">SERVER & KANÄLE</div><div id="channelList"></div></nav><div class="user"><span class="avatar">V</span><div style="flex:1"><strong id="selfName">Vynora User</strong><div class="online">● Online</div></div><button title="Profil bearbeiten" onclick="rename()">⚙</button></div></aside><main class="main"><header><span id="heading">♟ Freunde</span><div class="tabs" id="tabs"><button class="tab active" onclick="setTab('Online',this)">Online</button><button class="tab" onclick="setTab('Alle',this)">Alle</button><button class="tab" onclick="setTab('Ausstehend',this)">Ausstehend</button><button class="tab primary" onclick="addFriend()">Freund hinzufügen</button></div></header><div class="content"><section class="center"><div id="friendsPage" class="friends"><input class="filter" id="friendSearch" placeholder="Suchen" oninput="renderFriends()"><div class="muted" id="friendCount">ONLINE</div><div id="friendList"></div></div><div id="chatPage" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0"><div class="messages" id="messages"></div><form class="composer" id="chatForm"><input id="messageInput" autocomplete="off" placeholder="Nachricht schreiben..." maxlength="2000"><button>Senden</button></form></div></section><aside class="right"><h3 id="rightTitle">Jetzt aktiv</h3><div class="empty" id="rightContent"><b>Hier ist es noch ruhig …</b><p>Wenn deine Freunde aktiv sind, erscheint ihre Aktivität hier.</p></div></aside></div></main></div>
<script>
const KEY='vynora-demo-v1';let initial={name:'Vynora User',friends:[{id:'alex',name:'Alex',online:true},{id:'maya',name:'Maya',online:false},{id:'sam',name:'Sam',online:true}],servers:['Vynora Lounge','Gaming'],messages:{alex:[{from:'Alex',text:'Willkommen bei Vynora! 👋',time:'11:30'}],maya:[],sam:[]}};let data;try{data=JSON.parse(localStorage.getItem(KEY))||initial}catch{data=initial}let selected=null,tab='Online';function save(){localStorage.setItem(KEY,JSON.stringify(data))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function avatar(n){return '<span class="avatar">'+esc(n[0].toUpperCase())+'</span>'}function renderNav(){document.getElementById('selfName').textContent=data.name;document.getElementById('dmList').innerHTML=data.friends.map(f=>'<button class="item '+(selected===f.id?'selected':'')+'" onclick="openChat('+JSON.stringify(f.id).replace(/"/g,'&quot;')+')">'+avatar(f.name)+'<span>'+esc(f.name)+'</span></button>').join('');document.getElementById('channelList').innerHTML=data.servers.map(s=>'<button class="item" onclick="chooseServer('+JSON.stringify(s).replace(/"/g,'&quot;')+')">＃ '+esc(s)+'</button>').join('')}function showFriends(){selected=null;document.getElementById('heading').textContent='♟ Freunde';document.getElementById('tabs').classList.remove('hidden');document.getElementById('friendsPage').classList.remove('hidden');document.getElementById('chatPage').classList.add('hidden');document.getElementById('rightTitle').textContent='Jetzt aktiv';document.getElementById('rightContent').innerHTML='<b>Hier ist es noch ruhig …</b><p>Wenn deine Freunde aktiv sind, erscheint ihre Aktivität hier.</p>';renderFriends();renderNav()}function setTab(t,el){tab=t;document.querySelectorAll('.tab:not(.primary)').forEach(x=>x.classList.remove('active'));el.classList.add('active');renderFriends()}function renderFriends(){let q=document.getElementById('friendSearch').value.toLowerCase();let fs=data.friends.filter(f=>f.name.toLowerCase().includes(q)&&(tab!=='Online'||f.online));document.getElementById('friendCount').textContent=tab.toUpperCase()+' — '+fs.length;document.getElementById('friendList').innerHTML=fs.map(f=>'<div class="friend">'+avatar(f.name)+'<div><b>'+esc(f.name)+'</b><div style="font-size:12px;color:#999">'+(f.online?'🟢 Online':'Offline')+'</div></div><button onclick="openChat('+JSON.stringify(f.id).replace(/"/g,'&quot;')+')">💬 Nachricht</button></div>').join('')||'<p style="color:#999">Keine Einträge.</p>'}function openChat(id){selected=id;let f=data.friends.find(x=>x.id===id);if(!f)return;document.getElementById('heading').textContent='@ '+f.name;document.getElementById('tabs').classList.add('hidden');document.getElementById('friendsPage').classList.add('hidden');document.getElementById('chatPage').classList.remove('hidden');document.getElementById('rightTitle').textContent=f.name;document.getElementById('rightContent').textContent='Profil • '+(f.online?'Online':'Offline');renderMessages();renderNav();document.getElementById('messageInput').focus()}function renderMessages(){let list=document.getElementById('messages');list.innerHTML=(data.messages[selected]||[]).map(m=>'<div class="msg">'+avatar(m.from)+'<div><b>'+esc(m.from)+'</b> <small>'+esc(m.time)+'</small><p>'+esc(m.text)+'</p></div></div>').join('')||'<p style="color:#999">Hier beginnt eure Unterhaltung.</p>';list.scrollTop=list.scrollHeight}document.getElementById('chatForm').onsubmit=e=>{e.preventDefault();let inp=document.getElementById('messageInput');let text=inp.value.trim();if(!text||!selected)return;(data.messages[selected]??=[]).push({from:data.name,text,time:new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})});inp.value='';save();renderMessages()};function addFriend(){let name=prompt('Name des Demokontakts:');if(!name||!name.trim())return;name=name.trim().slice(0,40);let id='friend-'+Date.now();data.friends.push({id,name,online:false});data.messages[id]=[];save();showFriends()}function rename(){let n=prompt('Dein Anzeigename:',data.name);if(n&&n.trim()){data.name=n.trim().slice(0,40);save();renderNav()}}function addServer(){let n=prompt('Servername:');if(n&&n.trim()){data.servers.push(n.trim().slice(0,40));save();renderNav()}}function chooseServer(name){document.getElementById('heading').textContent='＃ '+name;document.getElementById('tabs').classList.add('hidden');document.getElementById('friendsPage').classList.add('hidden');document.getElementById('chatPage').classList.add('hidden');document.getElementById('rightTitle').textContent='Server';document.getElementById('rightContent').textContent='Serverkanäle und Mehrbenutzer-Chat folgen mit dem Backend.'}showFriends();
</script></body></html>
